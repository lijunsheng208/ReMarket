syntax = "proto3";
package remarket.user.v1;
option go_package = "remarket/backend/gen/user/v1;userv1";
import "google/protobuf/timestamp.proto";
service UserService {
  // 仅供独立 Feed 服务凭据读取粉丝 ID，不返回用户资料。
  rpc ListFeedFollowers(ListFeedFollowersRequest) returns (ListFeedFollowersResponse);
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc Unfollow(FollowRequest) returns (FollowResponse);
  rpc ListFollowers(ListFollowsRequest) returns (ListFollowsResponse);
  rpc ListFollowing(ListFollowsRequest) returns (ListFollowsResponse);
  rpc Register(RegisterRequest) returns (UserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  // 从已验证身份获取当前用户，不接受用户 ID。
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserResponse);
}
message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_object_key = 4;
  string role = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}
message RegisterRequest { string username = 1; string password = 2; string nickname = 3; }
message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string access_token = 1; google.protobuf.Timestamp expires_at = 2; User user = 3; }
message GetUserRequest { int64 id = 1; }
// User identity comes from verified context, never a client-supplied user ID.
message UpdateProfileRequest { optional string nickname = 1; optional string avatar_object_key = 2; }
message UserResponse { User user = 1; }

message GetCurrentUserRequest {}

message FollowRequest { int64 user_id = 1; }
message FollowResponse {}
message ListFollowsRequest { int64 user_id = 1; int64 after_id = 2; int32 page_size = 3; }
message FollowEntry { int64 id = 1; User user = 2; }
message ListFollowsResponse { repeated FollowEntry items = 1; int64 next_after_id = 2; }

message ListFeedFollowersRequest { int64 seller_id = 1; int64 after_id = 2; int32 page_size = 3; }
message ListFeedFollowersResponse { repeated int64 user_ids = 1; int64 next_after_id = 2; int64 total = 3; }
