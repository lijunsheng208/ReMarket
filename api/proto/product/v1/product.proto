syntax = "proto3";
package remarket.product.v1;
option go_package = "remarket/backend/gen/product/v1;productv1";
import "google/protobuf/timestamp.proto";
service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
  rpc PublishProduct(ChangeProductStateRequest) returns (ProductResponse);
  rpc OffShelfProduct(ChangeProductStateRequest) returns (ProductResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ON_SALE = 2;
  PRODUCT_STATUS_RESERVED = 3;
  PRODUCT_STATUS_SOLD = 4;
  PRODUCT_STATUS_OFF_SHELF = 5;
}
message ProductImage { int64 id = 1; string object_key = 2; int32 sort_order = 3; }
message Product {
  int64 id = 1; int64 seller_id = 2; int64 category_id = 3;
  string title = 4; string description = 5; int64 price_cent = 6;
  ProductStatus status = 7; int64 aggregate_version = 8;
  google.protobuf.Timestamp first_published_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  repeated ProductImage images = 12;
}
// Creates a draft. Seller is obtained from verified identity context.
message CreateProductRequest { int64 category_id = 1; string title = 2; string description = 3; int64 price_cent = 4; }
message GetProductRequest { int64 id = 1; }
// Public listing exposes ON_SALE products only. page_size defaults to 20, maximum 100.
message ListProductsRequest { int64 category_id = 1; int32 page = 2; int32 page_size = 3; }
message ListProductsResponse { repeated Product products = 1; int64 total = 2; }
message UpdateProductRequest {
  int64 id = 1; int64 expected_version = 2;
  optional int64 category_id = 3; optional string title = 4;
  optional string description = 5; optional int64 price_cent = 6;
}
message ChangeProductStateRequest { int64 id = 1; int64 expected_version = 2; }
message ProductResponse { Product product = 1; }
message Category { int64 id = 1; string code = 2; string name = 3; int32 sort_order = 4; }
message ListCategoriesRequest {}
message ListCategoriesResponse { repeated Category categories = 1; }
