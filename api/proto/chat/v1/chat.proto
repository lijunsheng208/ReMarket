syntax = "proto3";
package remarket.chat.v1;
option go_package = "remarket/backend/gen/chat/v1;chatv1";
import "google/protobuf/timestamp.proto";
service ChatService {
  // ACK 仅表示持久化成功，参与者由服务器返回用于在线通知。
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // 游标只增不减，不得超过当前已持久化序号。
  rpc ReadConversation(ReadConversationRequest) returns (ReadConversationResponse);
}
message Conversation {
  int64 id = 1; int64 product_id = 2; int64 buyer_id = 3; int64 seller_id = 4;
  int64 last_seq = 5; int64 last_message_id = 6;
  google.protobuf.Timestamp last_message_at = 7;
  google.protobuf.Timestamp created_at = 8;
  int64 last_read_seq = 9; int64 unread_count = 10; string last_message_content = 11;
}
message Message {
  int64 id = 1; int64 conversation_id = 2; int64 sender_id = 3;
  string client_msg_id = 4; int64 seq = 5; string content = 6;
  string message_type = 7; google.protobuf.Timestamp created_at = 8;
}
// 买卖双方从可信身份和 Product RPC 获取。
message CreateConversationRequest { int64 product_id = 1; }
message ListConversationsRequest { string cursor = 1; int32 page_size = 2; }
message ListConversationsResponse { repeated Conversation conversations = 1; string next_cursor = 2; }
// after_seq 存在时（包括零）正序补拉，与 before_seq 互斥；未传则查询最新历史。
// 首次 sync_until_seq=0 由服务捕获上界，后续页复用返回值。
message ListMessagesRequest { int64 conversation_id = 1; int64 before_seq = 2; optional int64 after_seq = 3; int32 page_size = 4; int64 sync_until_seq = 5; }
message ListMessagesResponse { repeated Message messages = 1; bool has_more = 2; int64 next_seq = 3; int64 sync_until_seq = 4; }

message SendMessageRequest { int64 conversation_id = 1; string client_msg_id = 2; string content = 3; }
message SendMessageResponse { Message message = 1; repeated int64 participant_ids = 2; }

message ReadConversationRequest { int64 conversation_id = 1; int64 last_read_seq = 2; }
message ReadState {
  int64 conversation_id = 1; int64 user_id = 2; int64 last_read_seq = 3;
  int64 unread_count = 4; int64 last_seq = 5;
}
message ReadConversationResponse { ReadState state = 1; repeated int64 participant_ids = 2; }
